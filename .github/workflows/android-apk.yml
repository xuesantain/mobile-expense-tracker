name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Expo config check
        run: npx expo config --type public

      - name: Generate Android project
        run: |
          set -euxo pipefail
          npx expo prebuild --platform android --no-install --clean 2>&1 | tee prebuild.log
          test -f android/gradlew
          find android -maxdepth 2 -type f | sort | head -100

      - name: Embed release JavaScript bundle
        run: |
          set -euxo pipefail
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --max-workers 1 \
            --reset-cache 2>&1 | tee expo-bundle.log
          test -s android/app/src/main/assets/index.android.bundle

      - name: Build release APK
        run: |
          set -euxo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --version
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee ../gradle-build.log

      - name: Verify APK contains release bundle
        run: |
          set -euxo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -s "$APK"
          unzip -l "$APK" | tee apk-contents.log
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            prebuild.log
            expo-bundle.log
            gradle-build.log
            apk-contents.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-expense-tracker-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
