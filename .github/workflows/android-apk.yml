name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Expo config check
        run: npx expo config --type public

      - name: Generate Android project
        run: |
          set -euxo pipefail
          npx expo prebuild --platform android --no-install --clean 2>&1 | tee prebuild.log
          test -f android/gradlew
          find android -maxdepth 2 -type f | sort | head -100

      - name: Build release APK
        run: |
          set -euxo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --version
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee ../gradle-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            prebuild.log
            gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-expense-tracker-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
